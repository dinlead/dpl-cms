# These workflows takes care of various CI tests.
on: pull_request
name: CI Tests
env:
  PHP_VERSION: 8.3
  COMPOSER_VERSION: v2

# Detect if this action is already running, and cancel it.
# This most likely happened because a second push has been made to a branch.
concurrency:
  group: ${{ github.repository_id }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ValidateComposer:
    name: Validate Composer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:${{ env.COMPOSER_VERSION }}
      - name: Validate composer.json
        run: |
          composer validate --no-check-all --no-check-publish
      - name: Install Dependencies
        run: |
          composer install --no-interaction --no-progress
      - name: Ensure install does not modify VCS
        run: git diff --exit-code

  Phpcs:
    name: Check code style
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        tools: composer:${{ env.COMPOSER_VERSION }}, cs2pr
        coverage: none
        extensions: gd
    - name: Install Dependencies
      run: |
        composer install --no-interaction --no-progress
    - name: Run PHPCS
      run: |
        vendor/bin/phpcs -q > phpcs-report.txt 2>&1 || true
        vendor/bin/phpcs -q --report=checkstyle | cs2pr
    - name: Upload PHPCS report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: phpcs-report
        path: phpcs-report.txt
        if-no-files-found: ignore

  TwigCsFixer:
    name: Check Twig code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:${{ env.COMPOSER_VERSION }}
          coverage: none
          extensions: gd
      - name: Install Dependencies
        run: |
          composer install --no-interaction --no-progress
      - name: Run Twig CS Fixer
        run: |
          vendor/bin/twig-cs-fixer lint 2>&1 | tee twig-cs-report.txt || true
          vendor/bin/twig-cs-fixer lint --report=github
      - name: Upload Twig CS Fixer report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: twig-cs-fixer-report
          path: twig-cs-report.txt
          if-no-files-found: ignore

  Phpstan:
    name: Analyse code using PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:${{ env.COMPOSER_VERSION }}
      - name: Install composer dependencies
        run: |
          composer install --no-interaction --no-progress
          # Add vendor/bin to PATH for subsequent steps, see https://docs.github.com/en/actions/reference/workflow-commands-for-github-actions#adding-a-system-path
          composer config bin-dir --absolute >> "${GITHUB_PATH}"
      - name: PHPStan analyse
        run: |
          phpstan 2>&1 | tee phpstan-report.txt
      - name: Upload PHPStan report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phpstan-report
          path: phpstan-report.txt
          if-no-files-found: ignore

  PhpUnit:
    name: Run PHP unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:${{ env.COMPOSER_VERSION }}
          coverage: xdebug
          extensions: gd
      - name: Install Dependencies
        run: |
          composer install --no-interaction --no-progress
      - name: Run PhpUnit
        run: |
          ./vendor/bin/phpunit --coverage-text --log-junit phpunit-junit.xml 2>&1 | tee phpunit-report.txt
      - name: Upload PhpUnit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phpunit-report
          path: |
            phpunit-report.txt
            phpunit-junit.xml
          if-no-files-found: ignore

  LightHouse:
    name: Test site performance using Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Our Taskfile requires a proper checkout to function because of
          # certain vars.
          fetch-depth: 0
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup site
        run: task ci:reset
      - name: Run Lighthouse test
        run: task ci:lighthouse
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-results
          path: .lighthouseci

  Pa11y:
    name: Test accessibility using Pa11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Our Taskfile requires a proper checkout to function because of
          # certain vars.
          fetch-depth: 0
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup site
        run: task ci:reset
      - name: Run Pa11y
        run: task ci:pa11y
      - name: Archive screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: pa11y-screenshots
          path: pa11y/screenshots

  Cypress:
    name: Run Cypress functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Our Taskfile requires a proper checkout to function because of
          # certain vars.
          fetch-depth: 0
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup site
        run: task ci:reset
      - name: Run Cypress
        run: task ci:cypress
      - name: Archive videoes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-videos
          path: cypress/videos
      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-screenshots
          path: cypress/screenshots

  MarkdownLint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # git with HTTP authentication provides an easy way for us to install
        # unreleased commits of NPM projects. Currently: Pa11yCI
      - name: Reconfigure git to use HTTP authentication
        run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf ssh://git@github.com/
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install problem matcher
        uses: xt0rted/markdownlint-problem-matcher@v3
      - name: Lint Markdown
        run: |
          npx markdownlint-cli2 2>&1 | tee markdownlint-report.txt
      - name: Upload MarkdownLint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: markdownlint-report
          path: markdownlint-report.txt
          if-no-files-found: ignore

  Shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.github_token }}
          fail_on_error: true
          # Use the GitHub PullRequest review comment that reports findings
          # as inlined comments in a PullRequest.
          # Read more about reporters: https://github.com/reviewdog/reviewdog#reporters
          reporter: github-pr-review
          # We can exclude a single directory, so we go for .git.
          path: dev-scripts
          # Set the default filter-mode which only reports violations caused by
          # added/modified lines.
          # Read more about filter-mode: https://github.com/reviewdog/reviewdog#filter-mode
          filter_mode: nofilter

  EslintDrupal:
    name: Lint Drupal assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # git with HTTP authentication provides an easy way for us to install
        # unreleased commits of NPM projects. Currently: Pa11yCI
      - name: Reconfigure git to use HTTP authentication
        run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf ssh://git@github.com/
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        run: |
          npx eslint web -c .eslintrc.json 2>&1 | tee eslint-drupal-report.txt
      - name: Upload ESLint Drupal report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eslint-drupal-report
          path: eslint-drupal-report.txt
          if-no-files-found: ignore

  EslintCypress:
    name: Lint Cypress tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # git with HTTP authentication provides an easy way for us to install
        # unreleased commits of NPM projects. Currently: Pa11yCI
      - name: Reconfigure git to use HTTP authentication
        run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf ssh://git@github.com/
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run ESLint
        run: |
          npx eslint cypress -c cypress/.eslintrc.json 2>&1 | tee eslint-cypress-report.txt
      - name: Upload ESLint Cypress report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eslint-cypress-report
          path: eslint-cypress-report.txt
          if-no-files-found: ignore

  CheckOpenApiSpec:
    name: Check OpenAPI specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Our Taskfile requires a proper checkout to function because of
          # certain vars.
          fetch-depth: 0
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup site
        run: task ci:reset
      - name: Validate specification
        run: task ci:openapi:validate
      - name: Download current specification
        run: task ci:openapi:download
      - name: Ensure specification has not drifted
        run: |
          git diff --ignore-space-at-eol openapi.json > openapi-drift.diff 2>&1 || true
          git diff --ignore-space-at-eol --exit-code openapi.json
      - name: Generate package for CMS API specification
        run: task dev:codegen:dpl-cms
      - name: Ensure CMS API package code has not drifted
        run: |
          git diff --ignore-space-at-eol packages/cms-api/* > cms-api-drift.diff 2>&1 || true
          git diff --ignore-space-at-eol --exit-code packages/cms-api/*
      - name: Upload OpenAPI drift reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: openapi-drift-report
          path: |
            openapi-drift.diff
            cms-api-drift.diff
          if-no-files-found: ignore

  CheckGraphQlSchema:
    name: Check GraphQL specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Our Taskfile requires a proper checkout to function because of
          # certain vars.
          fetch-depth: 0
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable BNF for site
        run: task dev:bnf:enable
      - name: Setup site
        run: task ci:reset
      - name: Extract GraphQL schema and generate client
        run: task dev:codegen:bnf-graphql
      - name: Ensure GraphQL client code has not drifted
        run: |
          git diff --ignore-space-at-eol web/modules/custom/bnf/src/GraphQL/* > graphql-drift.diff 2>&1 || true
          git diff --ignore-space-at-eol --exit-code web/modules/custom/bnf/src/GraphQL/*
      - name: Upload GraphQL drift report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: graphql-drift-report
          path: graphql-drift.diff
          if-no-files-found: ignore

  CheckDrupalConfig:
    name: Check Drupal Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Our Taskfile requires a proper checkout to function because of
          # certain vars.
          fetch-depth: 0
      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup site
        run: task ci:reset
      - name: Export configuration
        run: task dev:cli -- drush config-export -y
      - name: Check for uncommited configuration after install
        run: |
          git diff --ignore-space-at-eol config/sync/*.yml > drupal-config-drift.diff 2>&1 || true
          git diff --ignore-space-at-eol --exit-code config/sync/*.yml
      - name: Upload Drupal config drift report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: drupal-config-drift-report
          path: drupal-config-drift.diff
          if-no-files-found: ignore

  CheckPhpVersion:
    name: Check PHP version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Check PHP version in composer.json
        run: |
          if ! jq .require.php composer.json | grep ${{ env.PHP_VERSION }}; then
            echo "PHP version in composer.json does not match the version in the GitHub Actions."
            exit 1
          fi
      - name: Check PHP version in PHP service
        run: |
          if ! docker compose run php -- php --version | grep ${{ env.PHP_VERSION }}; then
            echo "PHP version for PHP service docker-compose.yml does not match the version in the GitHub Actions."
            exit 1
          fi
      - name: Check PHP version in CLI service
        run: |
          if ! docker compose run php -- php --version | grep ${{ env.PHP_VERSION }}; then
            echo "PHP version for CLI service docker-compose.yml does not match the version in the GitHub Actions."
            exit 1
          fi
